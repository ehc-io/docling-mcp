services:
  docling-mcp:
    build: .
    image: docling-mcp:latest
    container_name: docling-mcp
    ports:
      - "3010:3010"
    environment:
      - MCP_HOST=0.0.0.0
      - MCP_PORT=3010
      - MCP_TRANSPORT=streamable-http
    init: true
    restart: unless-stopped
    # Optional: mount volume for document caching
    # volumes:
    #   - ./data:/app/data

